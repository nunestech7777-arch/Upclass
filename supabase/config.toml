# Configuração versionada das Edge Functions (usada por `supabase functions deploy`).
# Funções chamadas por serviços externos ou por si mesmas (encadeamento) não recebem JWT do
# Supabase — são protegidas pelo secret na query string (KOMMO_WEBHOOK_SECRET / MercadoPhone).
project_id = "kcbjaknpaezmjiafdgpe"

[functions.kommo-webhook]
verify_jwt = false

[functions.kommo-reprocess]
verify_jwt = false

[functions.kommo-audit]
verify_jwt = false

[functions.kommo-sync-events]
verify_jwt = false

[functions.mercadophone-webhook]
verify_jwt = false

[functions.mercadophone-sync]
verify_jwt = false

# Diagnóstico do histórico oficial (GET /talks/{id}/messages): só com a service role (JWT verificado no gateway).
[functions.kommo-talk-probe]
verify_jwt = true

# Teste do webhook add_outgoing_message: o Kommo chama sem JWT (protegido por KOMMO_OUTGOING_PROBE_SECRET);
# as ações de admin (?action=) checam role service_role no próprio código.
[functions.kommo-outgoing-probe]
verify_jwt = false
